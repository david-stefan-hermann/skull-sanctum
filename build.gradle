plugins {
    id 'net.fabricmc.fabric-loom' version '1.17.0-alpha.7'
    id 'me.modmuss50.mod-publish-plugin' version '1.0.0'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
    // bcf-guide-book-lib: `./gradlew publishToMavenLocal` in ../bcf-guide-book-lib
    mavenLocal {
        content {
            includeGroup 'de.baconcakefactory'
        }
    }
}

loom {
    splitEnvironmentSourceSets()
    mods {
        skullsanctum {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

    // The guide book's screen (bundled as a nested jar).
    implementation "de.baconcakefactory:bcf-guide-book-lib:${project.guide_book_version}"
    include "de.baconcakefactory:bcf-guide-book-lib:${project.guide_book_version}"
}

// `./gradlew runClient -PbookShots`: the dev client joins the world run/saves/bookshots (item stacks need a world's
// registries, the title screen has none), opens every page of the guide book, saves
// run/screenshots/book_skullsanctum_<language>_<nr>.png and quits (see GuideBookClient in bcf-guide-book-lib). The
// language comes from run/options.txt (lang:de_de; pauseOnLostFocus:false keeps the pause menu away).
if (project.hasProperty('bookShots')) {
    loom {
        runs {
            client {
                vmArg "-Dbcf.guidebook.shots=${project.bookShots ?: 'skullsanctum'}"
                programArgs "--quickPlaySingleplayer", "bookshots", "--width", "1280", "--height", "720"
            }
        }
    }
}

// `./gradlew runServer -PdevScreenshot` + `./gradlew runClient -PdevScreenshot` (tools/dev-screenshot.sh): the client
// joins the dev server on localhost:25598, the server moves the player through the view points of -PdevViews
// ("x,y,z,yaw,pitch;..."), the client saves run/screenshots/<devShot>-<n>.png at each and quits (see
// skullsanctum.DevHooks and skullsanctum.client.DevClientHooks).
if (project.hasProperty('devScreenshot')) {
    def views = project.hasProperty('devViews') ? project.devViews : "0.5,-59,-6.5,0,20"
    def shot = project.hasProperty('devShot') ? project.devShot : "shot"
    loom {
        runs {
            client {
                vmArg "-Dskullsanctum.dev.views=${views}"
                vmArg "-Dskullsanctum.dev.screenshot=${shot}"
                if (project.hasProperty('devActions')) vmArg "-Dskullsanctum.dev.actions=${project.devActions}"
                programArgs "--quickPlayMultiplayer", "localhost:25598", "--width", "1280", "--height", "720"
            }
            server {
                vmArg "-Dskullsanctum.dev.views=${views}"
            }
        }
    }
}

// `./gradlew runServer -PselfTest`: the dev server builds sanctums on platforms high above spawn, forms and breaks them,
// sacrifices, buys heads from a test catalog, checks the recipes and book keys, writes
// run/skullsanctum-selftest/summary.txt and shuts down (see skullsanctum.DevSelfTest). Every run starts from a new world.
if (project.hasProperty('selfTest')) {
    loom {
        runs {
            server {
                vmArg "-Dskullsanctum.selftest=true"
            }
        }
    }
    tasks.named('runServer') {
        doFirst {
            delete file('run/world')
        }
    }
}

processResources {
    inputs.property "version", project.version
    inputs.property "loader_version", project.loader_version
    filteringCharset "UTF-8"

    filesMatching("fabric.mod.json") {
        expand "version": project.version,
                "loader_version": project.loader_version
    }
}

def targetJavaVersion = 25
tasks.withType(JavaCompile).configureEach {
    it.options.encoding = "UTF-8"
    it.options.release = targetJavaVersion
}

base {
    archivesName = project.archives_base_name
}

java {
    def javaVersion = JavaVersion.toVersion(targetJavaVersion)
    if (JavaVersion.current() < javaVersion) {
        toolchain.languageVersion = JavaLanguageVersion.of(targetJavaVersion)
    }
}

jar {
    from("LICENSE") {
        rename { "${it}_${project.archives_base_name}" }
    }
}

// `./gradlew publishMods` uploads build/libs/<jar> to CurseForge. Token and project id live in
// ~/.gradle/gradle.properties (ss.curseforge.token / ss.curseforge.projectId), never in the repository.
// Without a project id nothing is uploaded. The changelog is the top section of CHANGELOG.md.
publishMods {
    file = tasks.named('jar').flatMap { it.archiveFile }
    changelog = provider { topChangelogSection() }
    type = BETA
    displayName = "Skull Sanctum ${project.version}"
    version = project.version.toString()
    modLoaders.add("fabric")

    if (project.hasProperty('ss.curseforge.projectId')) {
        curseforge {
            accessToken = providers.gradleProperty("ss.curseforge.token")
            projectId = providers.gradleProperty("ss.curseforge.projectId")
            minecraftVersions.add(project.minecraft_version)
            javaVersions.add(JavaVersion.VERSION_25)
            clientRequired = true
            serverRequired = true
            requires("fabric-api")
        }
    }
}

/** First "## " section of CHANGELOG.md, without its heading. */
String topChangelogSection() {
    def lines = file("CHANGELOG.md").readLines()
    def out = []
    boolean inSection = false
    for (line in lines) {
        if (line.startsWith("## ")) {
            if (inSection) break
            inSection = true
            continue
        }
        if (inSection) out << line
    }
    return out.join("\n").trim()
}
